name: scrape-oude-site
# Haalt de originele (volle resolutie) afbeeldingen van sunforjoy.nl op naar branch 'scrape'
on:
  push:
    paths: ['.github/workflows/scrape.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: scrape }
      - name: Full-size images
        run: |
          mkdir -p fullsize && cd fullsize
          B=https://www.sunforjoy.nl/uimg/sunforjoy
          for f in b113599_img1f.jpg b113601_img1f.jpg b65901_img1f.jpg b65903_img1f.jpg sitetopf.jpg sitedeffancyf.jpg siteiconf.png b66354_att-handleiding-zonnebank.png; do
            curl -sSL -A "Mozilla/5.0" -o "$f" "$B/$f" || true
            curl -sSL -A "Mozilla/5.0" -o "w2400_$f" "$B/$f?w=2400" || true
          done
          curl -sSL -A "Mozilla/5.0" -o favicon.ico https://www.sunforjoy.nl/favicon.ico || true
          curl -sSL -A "Mozilla/5.0" -o privacy.html https://www.sunforjoy.nl/privacystatement-avg || true
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Full-size images" && git push origin scrape
